[images]
  remote_images = ["https://source.unsplash.com/.*", "https://images.unsplash.com/.*", "https://ext.same-assets.com/.*", "https://ugc.same-assets.com/.*"]

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Keep the default hosting address on the canonical public domain.
[[redirects]]
  from = "https://nursingcouncilbahamas.netlify.app/*"
  to = "https://nursingcouncilbahamas.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://nursingcouncilbahamas.netlify.app/*"
  to = "https://nursingcouncilbahamas.com/:splat"
  status = 301
  force = true
